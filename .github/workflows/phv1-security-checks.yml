name: PHV1 security checks

on:
  pull_request:
    branches:
      - main
      - agents/dev-review-readonly-v1
      - agents/review-isolation-a1
      - agents/secure-runtime-policy-a2-1
  push:
    branches:
      - 'hardening/**'
      - hardening-foundation-review
  workflow_dispatch:

# No secrets, deployments, privileged database access, or repository writes.
permissions:
  contents: read

concurrency:
  group: phv1-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-checks:
    name: SQL and JS security regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: retention_ci
          POSTGRES_PASSWORD: local_fixture
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RETENTION_TEST_DATABASE: postgresql://postgres:local_fixture@127.0.0.1:5432/retention_ci
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate repository JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z -- '*.js' '*.mjs' ':!:vendor/**')

      - name: Check all changes against main for whitespace errors
        shell: bash
        run: |
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base" HEAD

      - name: Run complete PGlite and JavaScript security regression tests
        run: node --test --test-reporter=tap tests/*.test.mjs

      - name: Run retention preview Python unit tests (offline)
        run: python3 -m unittest discover -s tests -p test_retention_preview.py -v

      - name: Run read-only development agent policy tests (offline)
        run: python3 -m unittest discover -s tests -p test_agent_workspace.py -v

      - name: Run A1 reviewed-snapshot and access-gate tests (offline)
        run: python3 -m unittest discover -s tests -p test_agent_review_snapshot.py -v

      - name: Run A2.1 offline runtime policy preflight tests
        run: python3 -m unittest discover -s tests -p test_agent_runtime_policy.py -v

      - name: Run A2.2 offline sandbox contract tests
        run: python3 -m unittest discover -s tests -p test_agent_sandbox_a2_2.py -v

  a2-2-container-probe:
    # Docker engine is a privileged trusted CI service: never invoke this job
    # for forked/untrusted PRs. No secrets or write permissions are available.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: A2.2 offline Linux container isolation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify offline probe contract without Docker
        run: python3 agent_service/runtime_deployment/sandbox_smoke.py --check-only

      - name: Prefetch pinned public base image outside the network-free sandbox
        run: docker pull python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df

      - name: Verify effective Docker isolation with synthetic files only
        run: python3 agent_service/runtime_deployment/sandbox_smoke.py --run-docker
