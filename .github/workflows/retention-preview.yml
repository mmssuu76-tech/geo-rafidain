name: Retention cleanup preview (DRY RUN ONLY)

on:
  workflow_dispatch:
  schedule:
    # 01:17 UTC = 04:17 Baghdad. Does not run until explicitly enabled below.
    - cron: '17 1 * * *'

# No repository write privileges, Supabase service_role key or deployments.
permissions:
  contents: read

concurrency:
  group: geo-rafidain-retention-preview-production
  cancel-in-progress: false

jobs:
  aggregate-preview:
    name: Verified aggregate dry-run (no deletions)
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.RETENTION_PREVIEW_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out reviewed files without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Preview fixed production endpoint (dry_run=1 only)
        shell: bash
        env:
          RETENTION_CRON_SECRET: ${{ secrets.RETENTION_CRON_SECRET }}
        run: python3 ops/retention_preview.py
